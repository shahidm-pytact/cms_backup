<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f4f4f4;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; background-color: #ffffff;">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="color: #27ae60; margin: 0;">Welcome to CMS!</h1>
        </div>
        <p>Hello {{name}},</p>
        <p>Your account has been successfully activated. You can now log in and start using the CMS platform.</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{login_url}}" 
               style="background-color: #27ae60; color: white; padding: 12px 30px; 
                      text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold;">
                Log In
            </a>
        </div>
        <p>Or visit: <a href="{{login_url}}" style="color: #3498db;">{{login_url}}</a></p>
        <p style="color: #7f8c8d; font-size: 12px; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
            If you have any questions, please contact our support team.
        </p>
    </div>
</body>
</html>
