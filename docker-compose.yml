# Uses .env in project root. Works locally and on server (image cms-api:latest).
# Local: run `docker build -t cms-api:latest .` first, then `docker compose up`.
# Server: workflow transfers image tar and this file; no build on server.
# Never run: docker compose down -v (removes volumes and deletes DB data).

services:
  db:
    image: postgres:15-alpine
    container_name: ${DB_CONTAINER_NAME:-cms-db}
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1112}
      POSTGRES_DB: ${POSTGRES_DB:-cms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cms_network

  migrate:
    image: cms-api:latest
    container_name: ${MIGRATE_CONTAINER_NAME:-cms-migrate}
    entrypoint: []
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:1112@db:5432/cms}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - cms_network

  # Blue-green: only one is "live" at a time; nginx proxies to .live-port (8000 or 8001)
  api-blue:
    image: cms-api:latest
    container_name: ${API_BLUE_CONTAINER_NAME:-cms-api-blue}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:1112@db:5432/cms}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - cms_network

  api-green:
    image: cms-api:latest
    container_name: ${API_GREEN_CONTAINER_NAME:-cms-api-green}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:1112@db:5432/cms}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - cms_network

volumes:
  postgres_data:

networks:
  cms_network:
    driver: bridge
    attachable: true
