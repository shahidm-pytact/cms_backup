# =============================================================================
# CMS Backend – Production Deploy (simple)
# =============================================================================
# Runner: self-hosted. Deploy target: backend server via SSH.
# Server path: /opt/apps/cms-blogs-management/backend (.env must exist there).
# Flow: build → transfer → load image → migrate → docker compose up -d.
# Trigger: push/merge to prod or workflow_dispatch.
# =============================================================================

name: Deploy CMS Backend (Production)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} echo "SSH OK"

      - name: Ensure deploy directory exists on server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/apps/cms-blogs-management/backend"

      - name: Generate .env from GitHub secrets and variables
        run: |
          # Write .env from Production environment (secrets + vars). Do not print contents.
          cat > .env << 'ENVEOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          AUTH_SECRET_KEY=${{ vars.AUTH_SECRET_KEY }}
          AUTH_ALGORITHM=${{ vars.AUTH_ALGORITHM }}
          AUTH_ACCESS_TOKEN_EXPIRE_MINUTES=${{ vars.AUTH_ACCESS_TOKEN_EXPIRE_MINUTES }}
          AUTH_PASSWORD_RESET_EXPIRY_HOURS=${{ vars.AUTH_PASSWORD_RESET_EXPIRY_HOURS }}
          AUTH_PASSWORD_RESET_TOKEN_EXPIRE_HOURS=${{ vars.AUTH_PASSWORD_RESET_EXPIRY_HOURS }}
          AUTH_INVITATION_EXPIRY_DAYS=${{ vars.AUTH_INVITATION_EXPIRY_DAYS }}
          AUTH_INVITATION_TOKEN_EXPIRE_DAYS=${{ vars.AUTH_INVITATION_EXPIRY_DAYS }}
          AUTH_JWT_ISSUER=${{ vars.AUTH_JWT_ISSUER }}
          API_TITLE=${{ vars.API_TITLE }}
          API_VERSION=${{ vars.API_VERSION }}
          API_PREFIX=${{ vars.API_PREFIX }}
          ENVIRONMENT=${{ vars.ENVIRONMENT }}
          DEBUG=${{ vars.DEBUG }}
          ALLOWED_IMAGE_TYPES=${{ vars.ALLOWED_IMAGE_TYPES }}
          MAX_IMAGE_SIZE_MB=${{ vars.MAX_IMAGE_SIZE_MB }}
          STORAGE_BASE_PATH=${{ vars.STORAGE_BASE_PATH }}
          EMAIL_FRONTEND_URL=${{ vars.EMAIL_FRONTEND_URL }}
          EMAIL_SMTP_HOST=${{ vars.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT=${{ vars.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME=${{ vars.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD=${{ vars.EMAIL_SMTP_PASSWORD }}
          EMAIL_SMTP_FROM_EMAIL=${{ vars.EMAIL_SMTP_FROM_EMAIL }}
          BLOG_REVALIDATION_WEBHOOK_SECRET=${{ vars.BLOG_REVALIDATION_WEBHOOK_SECRET }}
          BLOG_REVALIDATION_WEBHOOK_URL=${{ vars.BLOG_REVALIDATION_WEBHOOK_URL }}
          NEXT_API_SECRET=${{ vars.NEXT_API_SECRET }}
          CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
          CORS_ALLOW_CREDENTIALS=${{ vars.CORS_ALLOW_CREDENTIALS }}
          CORS_ALLOW_METHODS=${{ vars.CORS_ALLOW_METHODS }}
          CORS_ALLOW_HEADERS=${{ vars.CORS_ALLOW_HEADERS }}
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ vars.GOOGLE_CLIENT_SECRET }}
          DB_PORT=${{ vars.DB_PORT }}
          PERMISSION_AUDIT_LOG_ENABLED=${{ vars.PERMISSION_AUDIT_LOG_ENABLED }}
          PERMISSION_AUDIT_LOG_DENIED_ALL=${{ vars.PERMISSION_AUDIT_LOG_DENIED_ALL }}
          PERMISSION_CACHE_ENABLED=${{ vars.PERMISSION_CACHE_ENABLED }}
          PERMISSION_CACHE_FALLBACK_TO_DB=${{ vars.PERMISSION_CACHE_FALLBACK_TO_DB }}
          ENVEOF
          echo "Generated .env ($(wc -l < .env) lines)"

      - name: Build Docker image
        run: |
          export DOCKER_BUILDKIT=1
          docker build -t cms-api:latest .
          docker images cms-api:latest --format "{{.Repository}}:{{.Tag}}" | grep -q "cms-api:latest" || \
            (echo "ERROR: Docker image was not built successfully" && exit 1)

      - name: Save Docker image
        run: |
          docker save cms-api:latest | gzip > cms-api.tar.gz
          [ -f cms-api.tar.gz ] || (echo "ERROR: cms-api.tar.gz was not created" && exit 1)
          FILE_SIZE=$(stat -c%s cms-api.tar.gz 2>/dev/null || stat -f%z cms-api.tar.gz 2>/dev/null || echo "0")
          [ "$FILE_SIZE" -ge 100000 ] || (echo "ERROR: cms-api.tar.gz too small ($FILE_SIZE bytes)" && exit 1)

      - name: Transfer image, docker-compose, and .env to server
        run: |
          scp -P ${{ secrets.SSH_PORT }} cms-api.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/apps/cms-blogs-management/backend/
          scp -P ${{ secrets.SSH_PORT }} docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/apps/cms-blogs-management/backend/docker-compose.yml
          scp -P ${{ secrets.SSH_PORT }} .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/apps/cms-blogs-management/backend/.env

      - name: Load image and deploy on server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'EOFDEPLOY'
          set -e
          DEPLOY_DIR="/opt/apps/cms-blogs-management/backend"
          cd "$DEPLOY_DIR" || { echo "ERROR: $DEPLOY_DIR not found on server"; exit 1; }

          echo "[deploy] Loading image..."
          gunzip -t cms-api.tar.gz || (echo "ERROR: gzip integrity test failed" && exit 1)
          gunzip -c cms-api.tar.gz | docker load || (echo "ERROR: Failed to load Docker image" && exit 1)
          docker images cms-api:latest --format "{{.Repository}}:{{.Tag}}" | grep -q "cms-api:latest" || (echo "ERROR: Image not loaded" && exit 1)
          rm -f cms-api.tar.gz

          echo "[deploy] Stopping and removing existing api container so new image is used..."
          docker compose stop api || true
          docker compose rm -f api || true

          echo "[deploy] Starting db..."
          docker compose pull db || true
          docker compose up -d db
          echo "[deploy] Running migrations..."
          docker compose run --rm migrate
          echo "[deploy] Starting api with latest .env..."
          docker compose up -d api
          echo "[deploy] Containers after up -d:"
          docker compose ps -a
          echo "[deploy] API container logs (last 40 lines):"
          docker compose logs api --tail 40 || true
          echo "[deploy] Port 8000 listener:"
          ss -tlnp | grep 8000 || true

          docker image prune -f
          echo "Deploy completed"
          EOFDEPLOY

      - name: Show migrate logs on failure
        if: failure()
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/apps/cms-blogs-management/backend && docker compose logs migrate" || true

      - name: Verify deployment
        if: success()
        run: |
          sleep 20
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/apps/cms-blogs-management/backend && docker compose ps -a"
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "curl -sf --max-time 10 http://127.0.0.1:8000/health && echo ' API healthy' || echo ' WARNING: API not responding'" || true

      - name: Show API logs if not healthy
        if: success()
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/apps/cms-blogs-management/backend && docker compose logs api --tail 80" || true

      - name: Cleanup runner
        if: always()
        run: |
          rm -f cms-api.tar.gz .env
          docker image prune -f || true
